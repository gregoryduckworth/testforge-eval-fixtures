name: CI
on: [pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - uses: grafana/setup-k6-action@v1
      # Checks the load scripts parse and their options and thresholds are valid, without the load.
      - run: for script in perf/*.js; do k6 inspect "$script" > /dev/null; done
