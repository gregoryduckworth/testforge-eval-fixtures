<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Contact - Corner Shop</title>
  </head>
  <body>
    <header>
      <nav aria-label="Main">
        <a href="/">Home</a>
        <a href="/cart">Cart</a>
        <a href="/about">About</a>
        <a href="/contact">Contact</a>
      </nav>
    </header>
    <main>
      <h1>Contact us</h1>
      <form id="message">
        <label for="email">Email</label>
        <input id="email" type="email" name="email" required />
        <label for="body">Message</label>
        <textarea id="body" name="body" required></textarea>
        <button type="submit">Send</button>
      </form>
      <p id="sent" role="status"></p>
    </main>
    <script>
      document.getElementById('message').addEventListener('submit', (event) => {
        event.preventDefault();
        document.getElementById('sent').textContent = 'Thanks, we will reply within a day.';
      });
    </script>
  </body>
</html>
